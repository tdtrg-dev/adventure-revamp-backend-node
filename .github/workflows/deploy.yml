name:  Deploy

on:
  push:
    branches:
      - dev
      - staging

jobs:

  # =========================
  # DEV DEPLOYMENT
  # =========================
  dev-deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NEW }}

          script: |

            set -e
       


  # =========================
  # STAGING DEPLOYMENT
  # =========================
  staging-deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NEW }}

          script: |

            set -e

            cd /var/www/html/mongo-project-addventure/adventure-revamp-backend-node
            git pull
            pm2 restart all
